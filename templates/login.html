{% extends "base.html" %}

{% block title %}Sign In – TeamFinder{% endblock %}

{% block content %}
<div class="container py-5 my-auto">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card-custom p-4 p-md-5 shadow-lg border-0">
                <div class="text-center mb-4">
                    <div class="avatar-circle mx-auto mb-2 bg-primary-subtle text-primary" style="width: 56px; height: 56px; font-size: 1.5rem;">
                        <i class="bi bi-box-arrow-in-right"></i>
                    </div>
                    <h3 class="fw-bold text-dark">Welcome Back</h3>
                    <p class="text-muted small">Sign in to your TeamFinder student account</p>
                </div>

                <!-- Alert container for AJAX errors -->
                <div id="loginAlert" class="alert alert-danger d-none shadow-sm" role="alert"></div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold small text-muted">College Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                            <input type="email" class="form-control border-start-0 ps-0" id="email" name="email" placeholder="student@college.edu" required autocomplete="email">
                        </div>
                    </div>

                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label for="password" class="form-label fw-semibold small text-muted mb-0">Password</label>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                            <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                            <button class="btn btn-light border border-start-0" type="button" id="togglePasswordBtn">
                                <i class="bi bi-eye text-muted" id="toggleIcon"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" id="loginSubmitBtn" class="btn btn-primary-custom w-100 py-2 fw-semibold">
                        <span id="btnText"><i class="bi bi-box-arrow-in-right me-1"></i> Sign In</span>
                        <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                    </button>
                </form>

                <!-- Demo accounts quick-fill helper -->
                <div class="mt-4 p-3 bg-light rounded-3 border">
                    <div class="d-flex align-items-center justify-content-between mb-2">
                        <span class="small fw-bold text-dark"><i class="bi bi-key-fill text-warning me-1"></i> Demo Credentials:</span>
                    </div>
                    <div class="d-flex flex-wrap gap-2">
                        <button type="button" class="btn btn-xs btn-outline-primary btn-demo-fill" data-email="aarav.sharma@college.edu" data-pass="Password123!">
                            Student (Aarav)
                        </button>
                        <button type="button" class="btn btn-xs btn-outline-secondary btn-demo-fill" data-email="diya.patel@college.edu" data-pass="Password123!">
                            Student (Diya)
                        </button>
                        <button type="button" class="btn btn-xs btn-outline-danger btn-demo-fill" data-email="admin@teamfinder.edu" data-pass="AdminPassword123!">
                            Administrator
                        </button>
                    </div>
                </div>

                <div class="text-center mt-4 pt-2 border-top">
                    <span class="text-muted small">Don't have an account yet? </span>
                    <a href="{{ url_for('register_page') }}" class="fw-semibold text-primary text-decoration-none">Register as Student</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
document.addEventListener('DOMContentLoaded', () => {
    const loginForm = document.getElementById('loginForm');
    const alertBox = document.getElementById('loginAlert');
    const submitBtn = document.getElementById('loginSubmitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');

    // Toggle password visibility
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const passInput = document.getElementById('password');
    const toggleIcon = document.getElementById('toggleIcon');
    toggleBtn.addEventListener('click', () => {
        if (passInput.type === 'password') {
            passInput.type = 'text';
            toggleIcon.classList.replace('bi-eye', 'bi-eye-slash');
        } else {
            passInput.type = 'password';
            toggleIcon.classList.replace('bi-eye-slash', 'bi-eye');
        }
    });

    // Demo fill buttons
    document.querySelectorAll('.btn-demo-fill').forEach(btn => {
        btn.addEventListener('click', () => {
            document.getElementById('email').value = btn.getAttribute('data-email');
            document.getElementById('password').value = btn.getAttribute('data-pass');
            alertBox.classList.add('d-none');
        });
    });

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.classList.add('d-none');
        submitBtn.disabled = true;
        btnText.classList.add('d-none');
        btnSpinner.classList.remove('d-none');

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        try {
            const res = await apiRequest('/api/auth/login', 'POST', { email, password });
            showToast(res.message, 'success');
            window.location.href = res.redirect_url || '/dashboard';
        } catch (err) {
            alertBox.textContent = err.message || 'Login failed. Please verify credentials.';
            alertBox.classList.remove('d-none');
            submitBtn.disabled = false;
            btnText.classList.remove('d-none');
            btnSpinner.classList.add('d-none');
        }
    });
});
</script>
{% endblock %}
